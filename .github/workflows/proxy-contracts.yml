name: Proxy contract regressions

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Create repository virtual environment
        run: python -m venv .venv
      - name: Install dependencies and run offline regressions
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            repo_python=".venv/Scripts/python.exe"
          else
            repo_python=".venv/bin/python"
          fi
          "$repo_python" -m pip install -r requirements.txt
          "$repo_python" -B tools/test-proxy-contracts.py
