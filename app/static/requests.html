<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>最近请求 · Excel Proxy</title>
    <link rel="stylesheet" href="/ui/shared.css" />
  </head>
  <body>
    <main>
      <nav class="page-nav" aria-label="页面导航">
        <a href="/ui">连接与设置</a
        ><a href="/ui/requests" aria-current="page">最近请求</a
        ><a href="/ui/usage">用量与费用</a>
      </nav>
      <p id="page-error" class="error" role="alert" hidden></p>
      <p
        id="navigation-error"
        class="error"
        role="alert"
        tabindex="-1"
        hidden
      ></p>
      <section class="content-panel" aria-label="最近请求">
        <div class="section-heading">
          <div><p id="usage-period" class="muted">正在加载…</p></div>
          <div class="toolbar">
            <span id="live-status" class="status" role="status">正在读取…</span
            ><button id="refresh">刷新</button>
          </div>
        </div>
        <div class="request-search">
          <input
            id="request-filter"
            type="search"
            aria-label="筛选请求"
            placeholder="筛选模型、状态或请求 ID"
          />
        </div>
        <div
          class="table-wrap"
          role="region"
          aria-label="请求记录"
          tabindex="0"
        >
          <table>
            <thead>
              <tr>
                <th scope="col">时间</th>
                <th scope="col">模型</th>
                <th scope="col">状态</th>
                <th scope="col">输入</th>
                <th scope="col">缓存</th>
                <th scope="col">输出</th>
                <th
                  scope="col"
                  title="收到首段回复的等待时间，含排队和网络耗时。正文、推理和工具调用均计入，心跳不计；非流式请求统计完整回复到达时间。无记录或无输出时显示 —。"
                >
                  首字
                </th>
                <th scope="col">耗时</th>
                <th scope="col">详情</th>
              </tr>
            </thead>
            <tbody id="request-rows">
              <tr>
                <td colspan="9" class="empty">正在加载请求记录…</td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="pager">
          <span id="page-label" class="muted"></span>
          <div class="toolbar">
            <button id="previous-page" disabled>上一页</button
            ><button id="next-page" disabled>下一页</button>
          </div>
        </div>
      </section>
      <section
        id="prompt-panel"
        class="prompt"
        aria-labelledby="prompt-heading"
        hidden
      >
        <div class="section-heading">
          <div>
            <h2 id="prompt-heading">请求详情</h2>
            <p id="prompt-id" class="muted"></p>
          </div>
          <button id="close-prompt">收起详情</button>
        </div>
        <p id="request-diagnosis" role="status" hidden></p>
        <pre id="prompt-content" tabindex="0"></pre>
      </section>
      <footer>
        仅显示经本代理发送的请求。输入、缓存和输出的单位为 token。<span
          id="updated-at"
        ></span>
      </footer>
    </main>
    <script src="/ui/api.js"></script>
    <script src="/ui/requests.js"></script>
  </body>
</html>
